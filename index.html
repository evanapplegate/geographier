<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3ede2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Geographier</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <button id="home" class="ghost" title="Menu" aria-label="Menu">Geographier</button>
  <div class="streaks">
    <span id="streak" title="Current streak">🔥 0</span>
    <span id="best" title="Best streak">🏆 0</span>
  </div>
</header>

<main>
  <section id="menu" class="screen">
    <h1>Name the outline.</h1>
    <div class="group">
      <div class="label">Deck</div>
      <div class="choices" id="decks">
        <button data-deck="us-states">US states</button>
        <button data-deck="countries">Countries</button>
      </div>
    </div>
    <div class="group">
      <div class="label">Mode</div>
      <div class="choices" id="modes">
        <button data-mode="easy">Easy<small>tap one of four</small></button>
        <button data-mode="hard">Hard<small>type the name</small></button>
      </div>
    </div>
    <button id="start" class="primary big">Start</button>
    <p class="fine" id="menu-stats"></p>
  </section>

  <section id="quiz" class="screen" hidden>
    <p id="question" class="question"></p>
    <div id="map" class="map"><svg id="svg" preserveAspectRatio="xMidYMid meet"><path id="shape"/></svg></div>
    <div id="feedback" class="feedback" aria-live="polite"></div>
    <div id="options" class="options"></div>
    <form id="typeform" class="typeform" autocomplete="off" hidden>
      <input id="guess" type="text" inputmode="text" autocapitalize="words" autocorrect="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer">
      <button type="submit" class="primary">Check</button>
      <button type="button" id="skip" class="ghost">Skip</button>
    </form>
    <button id="next" class="primary big" hidden>Next</button>
  </section>
</main>

<footer>Outlines from <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>.</footer>
<script src="app.js"></script>
</body>
</html>
